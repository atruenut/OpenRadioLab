name: build

on:
  push:
  pull_request:

jobs:
  test-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ g++-mingw-w64-x86-64-win32
      - name: Portable tests
        run: make test
      - name: Cross-build the Windows exe
        run: make CROSS=x86_64-w64-mingw32- CXX=x86_64-w64-mingw32-g++-win32
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRadioLab-windows-x64
          path: OpenRadioLab.exe
